<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IntraWorld Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020817;
overflow-y:auto;
min-height:180vh;
color:white;
}

/* Animated Background */
body::before{
content:'';
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle,#ffffff66 1px,transparent 1px);
background-size:40px 40px;
z-index:-2;
}

body::after{
content:'';
position:fixed;
width:100%;
height:100%;
background:
linear-gradient(180deg,#000814,#061c3a,#000814);
opacity:.95;
z-index:-3;
}


.wrapper{
display:flex;
justify-content:center;
align-items:center;
padding:80px 20px;
}

.card{
width:430px;
padding:40px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
border-radius:25px;
backdrop-filter:blur(15px);
box-shadow:0 20px 50px rgba(0,0,0,.6);
}

.logo{
display:flex;
justify-content:center;
margin-bottom:20px;
}

.logo img{
width:170px;
filter:drop-shadow(0 0 15px #4ea3ff);
}

h1{
text-align:center;
margin-bottom:10px;
font-size:40px;
}

p{
text-align:center;
color:#d7d7d7;
margin-bottom:30px;
}

.input-box{
margin-bottom:20px;
}

.input-box input{
width:100%;
padding:15px;
border:none;
outline:none;
border-radius:12px;
background:#ffffff14;
border:1px solid rgba(255,255,255,.2);
color:white;
font-size:16px;
}

.input-box input::placeholder{
color:#ccc;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
font-size:14px;
}

a{
text-decoration:none;
color:#58a6ff;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:600;
cursor:pointer;
background:linear-gradient(135deg,#0066ff,#00bfff);
color:white;
transition:.3s;
}

button:hover{
transform:scale(1.03);
box-shadow:0 0 20px #2196f3;
}

.footer{
margin-top:30px;
text-align:center;
color:#bbb;
}

.extra{
margin-top:120px;
padding:60px;
text-align:center;
}

.extra h2{
font-size:45px;
margin-bottom:20px;
}

.extra p{
max-width:900px;
margin:auto;
line-height:2;
font-size:18px;
}

.feature{
margin-top:80px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.box{
background:#ffffff10;
padding:30px;
border-radius:20px;
border:1px solid rgba(255,255,255,.1);
}

.box h3{
margin-bottom:15px;
}

.box p{
text-align:left;
}

</style>
</head>
<body>

<div class="wrapper">
<div class="card">

<div class="logo">
<img src="logo.png" alt="IntraWorld Logo">
</div>

<h1>Welcome</h1>
<p>Sign in to continue to IntraWorld</p>

<form id="loginForm">
<div class="input-box">
<input type="email" id="loginEmail" placeholder="Email Address" required>
</div>

<div class="input-box">
<input type="password" id="loginPassword" placeholder="Password" required>
</div>

<div class="row">
<a href="forgotpassword.html" id="forgotPassword">Forgot Password?</a>
</div>

<button type="submit">Login</button>
</form>

<div class="footer">
<p>Don't have an account? <a href="register.html">Sign Up</a></p>
</div>

</div>
</div>

<div style="margin-top: 30px; display: flex; justify-content: center;">
    <div class="cf-turnstile" data-sitekey="YOUR_CLOUDFLARE_TURNSTILE_SITE_KEY"></div>
</div>
</section>

<!-- Firebase Authentication Integration -->
<script type="module">

import { auth } from "./firebase-config.js";

import {
    signInWithEmailAndPassword,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const loginForm = document.getElementById("loginForm");
const loginBtn = loginForm.querySelector("button");

function setLoading(isLoading){
    loginBtn.disabled = isLoading;

    if(isLoading){
        loginBtn.innerHTML="Signing In...";
    }else{
        loginBtn.innerHTML="Login";
    }
}

loginForm.addEventListener("submit",async(e)=>{

    e.preventDefault();

    const email=document.getElementById("loginEmail").value.trim();
    const password=document.getElementById("loginPassword").value;

    if(email==="" || password===""){
        alert("Please enter Email and Password.");
        return;
    }

    setLoading(true);

    try{

        const credential=await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        const user=credential.user;

        if(user.email==="admin@intraworld.com"){
            window.location.href="admin.html";
        }else{
            window.location.href="dashboard.html";
        }

    }catch(error){

        switch(error.code){

            case "auth/user-not-found":
                alert("Account not found.");
                break;

            case "auth/wrong-password":
                alert("Incorrect password.");
                break;

            case "auth/invalid-email":
                alert("Invalid email address.");
                break;

            case "auth/invalid-credential":
                alert("Invalid email or password.");
                break;

            default:
                alert(error.message);
        }

    }

    setLoading(false);

});

onAuthStateChanged(auth,(user)=>{

    if(!user) return;

    if(user.email==="admin@intraworld.com"){
        window.location.href="admin.html";
    }else{
        window.location.href="dashboard.html";
    }

});

</script>
</body>
</html>
