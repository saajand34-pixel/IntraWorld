<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntraWorld - Sign In</title>

    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Shared resets & background styling -->
    <link rel="stylesheet" href="css/theme-base.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #030712;
            background-image: radial-gradient(rgba(56, 189, 248, 0.15) 1px, transparent 1px);
            background-size: 24px 24px;
            color: #ffffff;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: rgba(10, 22, 40, 0.75);
            border: 1px solid rgba(0, 140, 255, 0.25);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0, 102, 255, 0.15), 0 20px 50px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 02px;
        }

        .brand-logo {
            width: 180px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(0, 140, 255, 0.5));
            transition: transform 0.3s ease;
        }

        .brand-logo:hover {
            transform: scale(1.05);
        }

        .header h1 {
            letter-spacing: 1px;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ffffff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 13px;
            color: #94a3b8;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 12px;
            color: #cbd5e1;
            font-weight: 500;
        }

        .field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-wrapper .icon {
            position: absolute;
            left: 14px;
            color: #38bdf8;
            font-size: 14px;
        }

        .field-wrapper input {
            width: 100%;
            padding: 12px 40px 12px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .field-wrapper input:focus {
            border-color: #38bdf8;
            background: rgba(0, 136, 255, 0.1);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            color: #64748b;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .toggle-password:hover {
            color: #38bdf8;
        }

        .btn-submit {
            width: 100%;
            padding: 12px 20px;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #0052d4, #4364f7);
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.3);
            border-radius: 10px;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-top: 24px;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            box-shadow: 0 0 30px rgba(0, 102, 255, 0.6);
            transform: translateY(-1px);
        }

        .footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #94a3b8;
        }

        .footer-link a {
            color: #38bdf8;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header">
            <div class="logo-container">
                <img src="logo.png" alt="IntraWorld Logo" class="brand-logo" onerror="this.style.display='none'">
            </div>
            <h1>Welcome</h1>
            <p>Sign in to continue to IntraWorld</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="field-wrapper">
                    <i class="fa-solid fa-envelope icon"></i>
                    <input type="email" id="email" name="email" placeholder="john@gmail.com" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="field-wrapper">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>
        </form>

        <div class="footer-link">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>

    <script>
        // Password Visibility Toggle Logic
        const togglePassword = document.getElementById('togglePassword');
        const passwordField = document.getElementById('password');

        if (togglePassword && passwordField) {
            togglePassword.addEventListener('click', () => {
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);
                togglePassword.classList.toggle('fa-eye');
                togglePassword.classList.toggle('fa-eye-slash');
            });
        }
    </script>

    <!-- JS module scripts for authentication -->
    <script type="module" src="./firebase-config.js"></script>
    <script type="module" src="./login.js"></script>
</body>
</html>
