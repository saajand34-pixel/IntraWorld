<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntraWorld Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <!-- Shared reset + dotted background theme -->
    <link rel="stylesheet" href="css/theme-base.css">

    <style>
        body {
            overflow-y: auto;
            min-height: 180vh;
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
        }

        .card {
            width: 430px;
            padding: 40px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, .6);
        }

        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo img {
            width: 170px;
            filter: drop-shadow(0 0 15px #4ea3ff);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 40px;
        }

        p {
            text-align: center;
            color: #d7d7d7;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box input {
            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            border-radius: 12px;
            background: #ffffff14;
            border: 1px solid rgba(255, 255, 255, .2);
            color: white;
            font-size: 16px;
        }

        .input-box input::placeholder {
            color: #ccc;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        a {
            text-decoration: none;
            color: #58a6ff;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #0066ff, #00bfff);
            color: white;
            transition: .3s;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px #2196f3;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #bbb;
        }
    </style>

    <!-- Global auth check guard -->
    <script type="module" src="auth-check.js"></script>
</head>
<body>

    <div class="wrapper">
        <div class="card">

            <div class="logo">
                <img src="logo.png" alt="IntraWorld Logo">
            </div>

            <h1>Welcome</h1>
            <p>Sign in to continue to IntraWorld</p>

            <form id="loginForm">
                <div class="input-box">
                    <input type="email" id="loginEmail" placeholder="Email Address" required>
                </div>

                <div class="input-box">
                    <input type="password" id="loginPassword" placeholder="Password" required>
                </div>

                <div class="row">
                    <a href="forgotpassword.html" id="forgotPassword">Forgot Password?</a>
                </div>

                <button type="submit">Login</button>
            </form>

            <div class="footer">
                <p>Don't have an account? <a href="register.html">Sign Up</a></p>
            </div>

        </div>
    </div>

    <!-- External Module Script -->
    <script type="module" src="login.js"></script>
</body>
</html>
