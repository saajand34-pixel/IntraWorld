<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Posts - Intra World</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    
    <!-- Load auth check FIRST -->
    <script type="module" src="auth-check.js"></script>

    <!-- Shared app-shell styles (topbar, sidebar, overlay, layout) -->
    <link rel="stylesheet" href="css/app-shell.css">

    <style>
        .content {
            flex: 1;
            padding: 35px;
            width: 100%;
            overflow-y: auto;
        }

        .create-post-card {
            background: #081b2e;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 30px;
            width: 100%;
        }

        .post-input-header {
            display: flex;
            align-items: flex-start;
            gap: 18px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #0066ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }

        .create-post-card textarea {
            width: 100%;
            height: 100px;
            background: #102b45;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px;
            color: white;
            resize: none;
            outline: none;
            font-size: 15px;
            font-family: Poppins, sans-serif;
        }

        .create-post-card textarea::placeholder {
            color: #7db7ff;
        }

        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .upload-btn {
            background: transparent;
            color: #7db7ff;
            border: none;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .upload-btn:hover { 
            color: #fff; 
        }

        .submit-post-btn {
            background: #0066ff;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .submit-post-btn:hover { 
            background: #0f3f8c;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 102, 255, 0.25);
        }

        .ai-shield-status {
            margin-top: 12px;
            font-size: 13px;
            padding: 10px 14px;
            border-radius: 8px;
            display: none;
        }

        .ai-shield-status.warning {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid #ef4444;
        }

        .ai-shield-status.success {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
            border: 1px solid #22c55e;
        }

        .post-card {
            background: #081b2e;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 22px;
            width: 100%;
        }

        .post-author {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        .post-author .user-avatar {
            width: 45px;
            height: 45px;
            font-size: 18px;
        }

        .author-info h4 { 
            font-size: 16px; 
            font-weight: 600;
            margin-bottom: 3px;
        }

        .author-info p { 
            font-size: 12px; 
            color: #7db7ff; 
        }

        .post-content {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 18px;
            color: #e0e0e0;
        }

        .post-media {
            width: 100%;
            border-radius: 12px;
            max-height: 400px;
            object-fit: cover;
            margin-bottom: 18px;
        }

        .deepfake-verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 102, 255, 0.15);
            color: #38bdf8;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin-bottom: 14px;
        }

        .post-footer {
            display: flex;
            gap: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .interaction-btn {
            background: transparent;
            border: none;
            color: #7db7ff;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .interaction-btn:hover { 
            color: #fff; 
        }

        @media (max-width: 768px) {
            .search {
                width: 180px;
            }

            .content {
                padding: 20px;
            }

            .create-post-card {
                padding: 18px;
            }

            .create-post-card textarea {
                font-size: 14px;
                height: 80px;
            }

            .submit-post-btn {
                padding: 10px 24px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
        <div class="sidebar-header">
            <button class="close-btn" id="closeMenu" aria-label="Close navigation">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="logo">
                <img src="logo.png" alt="Intra World Logo">
                <h2>INTRA WORLD</h2>
            </div>
        </div>

        <div class="menu-container">
            <nav class="menu">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
                <a href="connect.html"><i class="fa-solid fa-user-group"></i><span>Student Connect</span></a>
                <a href="posts.html" class="active"><i class="fa-solid fa-newspaper"></i><span>Posts</span></a>
                <a href="messages.html"><i class="fa-solid fa-comments"></i><span>Messages</span></a>
                <a href="profile.html"><i class="fa-solid fa-user"></i><span>Profile</span></a>
                <a href="settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
            </nav>
        </div>

        <div class="bottom">
            <nav class="menu">
                <a class="logout" id="logoutBtn" href="index.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </nav>
        </div>
    </aside>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Main Content -->
    <main class="main">
        <header class="topbar">
            <button class="menu-btn" id="openMenu" aria-label="Open navigation">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="search">
                <input type="text" placeholder="Search Posts, Topics...">
            </div>

            <div class="user">
                <span id="welcomeName">Loading...</span>
                <img id="profileImage" src="https://via.placeholder.com/45" alt="Profile">
            </div>
        </header>

        <section class="content">
            <div class="create-post-card">
                <div class="post-input-header">
                    <div class="user-avatar" id="myAvatar">U</div>
                    <textarea id="postContentInput" placeholder="Share research updates, academic achievements, or projects..."></textarea>
                </div>

                <div class="ai-shield-status" id="aiShieldStatus"></div>

                <div class="post-actions">
                    <label class="upload-btn">
                        <i class="fa-solid fa-image"></i> Add Media
                        <input type="file" id="mediaUpload" accept="image/*" style="display: none;">
                    </label>

                    <button class="submit-post-btn" id="publishPostBtn">
                        <i class="fa-solid fa-shield-halved"></i> Scan & Post
                    </button>
                </div>
            </div>

            <div id="postsFeed">
                <div style="color: #7db7ff; text-align: center; padding: 40px;">Loading academic feed...</div>
            </div>
        </section>
    </main>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="posts.js"></script>
    <script>
        function waitForAuthReady() {
            return new Promise((resolve) => {
                if (document.documentElement.getAttribute("data-auth-ready") === "true") {
                    resolve();
                    return;
                }

                const observer = new MutationObserver((mutations) => {
                    if (document.documentElement.getAttribute("data-auth-ready") === "true") {
                        observer.disconnect();
                        resolve();
                    }
                });

                observer.observe(document.documentElement, { attributes: true });

                setTimeout(() => {
                    observer.disconnect();
                    resolve();
                }, 5000);
            });
        }

        waitForAuthReady().then(() => {
            const currentUserRaw = localStorage.getItem("currentUser");
            if (currentUserRaw) {
                const currentUser = JSON.parse(currentUserRaw);
                const welcomeName = document.getElementById("welcomeName");
                const profileImage = document.getElementById("profileImage");
                if (welcomeName) welcomeName.textContent = currentUser.fullName || "Student User";
                if (profileImage && currentUser.avatar) profileImage.src = currentUser.avatar;
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("overlay");
            const openMenu = document.getElementById("openMenu");
            const closeMenu = document.getElementById("closeMenu");

            function openSidebar() {
                sidebar.classList.add("open");
                overlay.classList.add("show");
                document.body.style.overflow = "hidden";
            }

            function closeSidebar() {
                sidebar.classList.remove("open");
                overlay.classList.remove("show");
                document.body.style.overflow = "";
            }

            openMenu.addEventListener("click", openSidebar);
            closeMenu.addEventListener("click", closeSidebar);
            overlay.addEventListener("click", closeSidebar);

            document.querySelectorAll(".menu a").forEach(link => {
                link.addEventListener("click", () => closeSidebar());
            });

            document.addEventListener("keydown", event => {
                if (event.key === "Escape") closeSidebar();
            });

            document.getElementById("logoutBtn")?.addEventListener("click", (e) => {
                e.preventDefault();
                localStorage.removeItem("currentUser");
                window.location.href = "index.html";
            });
        });
    </script>
</body>
</html>
