<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Intra World</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    
    <!-- Shared app-shell styles (topbar, sidebar, overlay, layout) -->
    <link rel="stylesheet" href="css/app-shell.css">

    <style>
        /* Chat Container */
        .chat-container {
            flex: 1;
            display: flex;
            background: #061524;
        }

        .user-list-pane {
            width: 320px;
            background: #081b2e;
            border-right: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
        }

        .pane-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 18px;
            font-weight: 600;
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-item:hover, .user-item.active {
            background: #102b45;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #0066ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
        }

        .user-details h4 {
            font-size: 14px;
            font-weight: 500;
        }

        .user-details p {
            font-size: 11px;
            color: #7db7ff;
        }

        .chat-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #061524;
        }

        .chat-header {
            padding: 18px 25px;
            background: #081b2e;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .messages-box {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 60%;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.sent {
            align-self: flex-end;
            background: #0066ff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background: #102b45;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            padding: 20px;
            background: #081b2e;
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            gap: 12px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 14px 18px;
            background: #102b45;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            outline: none;
        }

        .chat-input-area button {
            padding: 0 25px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        .chat-input-area button:hover {
            background: #0f3f8c;
        }

        .no-chat-selected {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7db7ff;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .user-list-pane {
                width: 240px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
        <div class="sidebar-header">
            <button class="close-btn" id="closeMenu" aria-label="Close navigation">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="logo">
                <img src="logo.png" alt="Intra World Logo">
                <h2>INTRA WORLD</h2>
            </div>
        </div>

        <div class="menu-container">
            <nav class="menu">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
                <a href="connect.html"><i class="fa-solid fa-user-group"></i><span>Student Connect</span></a>
                <a href="posts.html"><i class="fa-solid fa-newspaper"></i><span>Posts</span></a>
                <a href="messages.html" class="active"><i class="fa-solid fa-comments"></i><span>Messages</span></a>
                <a href="profile.html"><i class="fa-solid fa-user"></i><span>Profile</span></a>
                <a href="settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
            </nav>
        </div>

        <div class="bottom">
            <nav class="menu">
                <a class="logout" href="index.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </nav>
        </div>
    </aside>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Main Content -->
    <main class="main">
        <header class="topbar">
            <button class="menu-btn" id="openMenu" aria-label="Open navigation">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="search">
                <input type="text" placeholder="Search Users, Messages...">
            </div>

            <div class="user">
                <span id="welcomeName">Loading...</span>
                <img id="profileImage" src="https://via.placeholder.com/45" alt="Profile">
            </div>
        </header>

        <div class="chat-container">
            <div class="user-list-pane">
                <div class="pane-header">Registered Users</div>
                <div class="user-list" id="userList">
                    <div style="padding: 20px; color: #7db7ff;">Loading registered profiles...</div>
                </div>
            </div>

            <div class="chat-pane" id="chatPane">
                <div class="no-chat-selected" id="noChatPlaceholder">
                    Select a user profile from the left to start chatting
                </div>

                <div id="activeChatContent" style="display: none; height: 100%; flex-direction: column;">
                    <div class="chat-header">
                        <div class="user-avatar" id="activeUserAvatar">U</div>
                        <div>
                            <h3 id="activeUserName">User Name</h3>
                            <p style="font-size: 11px; color: #7db7ff;" id="activeUserEmail">user@example.com</p>
                        </div>
                    </div>

                    <div class="messages-box" id="messagesBox"></div>

                    <form class="chat-input-area" id="chatForm">
                        <input type="text" id="messageInput" placeholder="Type a message..." required autocomplete="off">
                        <button type="submit"><i class="fa-solid fa-paper-plane"></i> Send</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="messages.js"></script>
    <script>
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const openMenu = document.getElementById("openMenu");
        const closeMenu = document.getElementById("closeMenu");

        function openSidebar() {
            sidebar.classList.add("open");
            overlay.classList.add("show");
            document.body.style.overflow = "hidden";
        }

        function closeSidebar() {
            sidebar.classList.remove("open");
            overlay.classList.remove("show");
            document.body.style.overflow = "";
        }

        openMenu.addEventListener("click", openSidebar);
        closeMenu.addEventListener("click", closeSidebar);
        overlay.addEventListener("click", closeSidebar);

        document.querySelectorAll(".menu a").forEach(link => {
            link.addEventListener("click", () => closeSidebar());
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") closeSidebar();
        });
    </script>
</body>
</html>
