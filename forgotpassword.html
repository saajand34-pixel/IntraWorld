<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntraWorld - Forgot Password</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #051424;
            background-image: radial-gradient(#273647 1px, transparent 1px);
            background-size: 24px 24px;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        .recovery-card {
            width: 100%;
            max-width: 480px;
            padding: 40px;
            background: rgba(10, 22, 40, 0.75);
            border: 1px solid rgba(0, 140, 255, 0.25);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0, 102, 255, 0.15), 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
        }

        .header p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .input-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 500;
            color: #cbd5e1;
        }

        .field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-wrapper i {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 15px;
        }

        .field-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .field-wrapper input:focus {
            border-color: #0088ff;
            background: rgba(0, 136, 255, 0.08);
            box-shadow: 0 0 10px rgba(0, 136, 255, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 102, 255, 0.4);
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 102, 255, 0.7);
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }

        .footer-link a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="recovery-card">
        <div class="header">
            <h1>Reset Password</h1>
            <p>Verify security details associated with your account</p>
        </div>

        <form id="recoveryForm">
            <div class="input-group">
                <label>Registered Email</label>
                <div class="field-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="recoveryEmail" placeholder="name@company.com" required>
                </div>
            </div>

            <div class="input-group">
                <label>Favourite Sport</label>
                <div class="field-wrapper">
                    <i class="fa-solid fa-futbol"></i>
                    <input type="text" id="recoverySport" placeholder="Enter favourite sport" required>
                </div>
            </div>

            <div class="input-group">
                <label>Primary Ambition</label>
                <div class="field-wrapper">
                    <i class="fa-solid fa-bullseye"></i>
                    <input type="text" id="recoveryAmbition" placeholder="Enter primary ambition" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="resetBtn">Verify & Reset Password</button>
        </form>

        <div class="footer-link">
            Remembered password? <a href="index.html">Sign In</a>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const recoveryForm = document.getElementById("recoveryForm");

        recoveryForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const emailInput = document.getElementById("recoveryEmail").value.trim().toLowerCase();
            const sportInput = document.getElementById("recoverySport").value.trim().toLowerCase();
            const ambitionInput = document.getElementById("recoveryAmbition").value.trim().toLowerCase();

            try {
                // Fetch user document by email
                const q = query(collection(db, "users"), where("email", "==", emailInput));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    alert("No account found with this email.");
                    return;
                }

                let userData = null;
                querySnapshot.forEach((doc) => {
                    userData = doc.data();
                });

                // Case-insensitive validation against stored answers
                const storedSport = (userData.favouriteSport || "").trim().toLowerCase();
                const storedAmbition = (userData.ambition || "").trim().toLowerCase();

                if (sportInput === storedSport && ambitionInput === storedAmbition) {
                    await sendPasswordResetEmail(auth, emailInput);
                    alert("Security details verified successfully! A password reset link has been sent to your email.");
                    window.location.href = "index.html";
                } else {
                    alert("Verification failed: Answers do not match our records.");
                }

            } catch (error) {
                console.error("Recovery Error:", error);
                alert("Error verifying details: " + error.message);
            }
        });
    </script>
</body>
</html>
