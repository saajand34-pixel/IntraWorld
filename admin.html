<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>IntraWorld Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Shared reset + dotted background theme -->
<link rel="stylesheet" href="css/theme-base.css">

<style>

header{

display:flex;
justify-content:space-between;
align-items:center;

padding:20px 40px;

background:#071426;

box-shadow:0 10px 25px rgba(0,0,0,.4);

}

header h1{

font-size:28px;

}

header button{

padding:12px 24px;

background:#ff4444;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:600;

}

.container{

padding:35px;

}

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:25px;

margin-bottom:35px;

}

.card{

background:#0d2039;

padding:25px;

border-radius:18px;

box-shadow:0 10px 20px rgba(0,0,0,.35);

}

.card h2{

font-size:18px;

margin-bottom:10px;

color:#9dc8ff;

}

.card span{

font-size:38px;

font-weight:700;

}

.search{

margin-bottom:25px;

}

.search input{

width:100%;

padding:15px;

border-radius:12px;

border:none;

font-size:16px;

background:#122947;

color:white;

}

table{

width:100%;

border-collapse:collapse;

background:#081624;

overflow:hidden;

border-radius:16px;

}

thead{

background:#0066ff;

}

th{

padding:16px;

}

td{

padding:16px;

border-bottom:1px solid rgba(255,255,255,.08);

text-align:center;

}

img.profile{

width:60px;

height:60px;

border-radius:50%;

object-fit:cover;

}

.delete{

background:#ff3b3b;

border:none;

padding:8px 14px;

border-radius:8px;

color:white;

cursor:pointer;

}

.delete:hover{

background:#d91f1f;

}

@media(max-width:900px){

table{

display:block;

overflow:auto;

}

}

</style>

</head>

<body>

<header>

<h1>IntraWorld Admin Dashboard</h1>

<button id="logoutBtn">Logout</button>

</header>

<div class="container">

<div class="cards">

<div class="card">

<h2>Total Members</h2>

<span id="totalUsers">0</span>

</div>

<div class="card">

<h2>Verified Users</h2>

<span id="verifiedUsers">0</span>

</div>

</div>

<div class="search">

<input
type="text"
id="search"
placeholder="Search by Name, Email or College">

</div>

<table>

<thead>

<tr>

<th>Photo</th>

<th>Name</th>

<th>Email</th>

<th>Mobile</th>

<th>College</th>

<th>Qualification</th>

<th>Registered</th>

<th>Delete</th>

</tr>

</thead>

<tbody id="userTable">

</tbody>

</table>

</div>

<script type="module" src="admin.js"></script>

</body>

</html>
