<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Intra World</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/app-shell.css">

    <!-- Auth Guard -->
    <script type="module" src="auth-check.js"></script>
</head>
<body>

    <aside class="sidebar" id="sidebar" role="navigation">
        <div class="sidebar-header">
            <button class="close-btn" id="closeMenu" aria-label="Close navigation">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="logo">
                <img src="logo.png" alt="Intra World Logo">
                <h2>INTRA WORLD</h2>
            </div>
        </div>

        <div class="menu-container">
            <nav class="menu">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
                <a href="connect.html"><i class="fa-solid fa-user-group"></i><span>Student Connect</span></a>
                <a href="posts.html"><i class="fa-solid fa-newspaper"></i><span>Posts</span></a>
                <a href="messages.html"><i class="fa-solid fa-comments"></i><span>Messages</span></a>
                <a href="settings.html" class="active"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
            </nav>
        </div>

        <div class="bottom">
            <nav class="menu">
                <a class="logout" id="logoutBtn" href="#">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </nav>
        </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
        <header class="topbar">
            <button class="menu-btn" id="openMenu" aria-label="Open navigation">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="search">
                <input type="text" placeholder="Search settings...">
            </div>
            <div class="user">
                <span id="welcomeName">Loading...</span>
                <img id="profileImage" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-3.8-.85-5.05-2.2.03-1.68 3.37-2.6 5.05-2.6s5.02.92 5.05 2.6C15.8 19.15 14.03 20 12 20z'/></svg>" alt="Profile">
            </div>
        </header>

        <section class="content">
            <h2>Account Settings</h2>
            
            <div class="settings-card">
                <h3><i class="fa-solid fa-image"></i> Profile Photo</h3>
                <p>Upload a new avatar to customize your Intra World identity.</p>
                
                <div class="profile-upload-container">
                    <img id="settings-avatar-preview" class="dashboard-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-3.8-.85-5.05-2.2.03-1.68 3.37-2.6 5.05-2.6s5.02.92 5.05 2.6C15.8 19.15 14.03 20 12 20z'/></svg>" alt="Profile Preview">
                    
                    <div class="upload-controls">
                        <label for="profilePhotoInput" class="upload-btn">
                            <i class="fa-solid fa-camera"></i> Choose Photo
                        </label>
                        <input type="file" id="profilePhotoInput" accept="image/*" hidden>
                        <button id="savePhotoBtn" class="save-btn" style="display: none;">
                            <i class="fa-solid fa-check"></i> Save Photo
                        </button>
                    </div>
                </div>
            </div>

            <div id="settingsContainer" style="margin-top: 20px;">
                <p>Manage your account preferences and notifications.</p>
            </div>
        </section>
    </main>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="app-shell.js"></script>
    <script type="module" src="settings.js"></script>
</body>
</html>
