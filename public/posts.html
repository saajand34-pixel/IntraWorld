    <!-- BULLETPROOF AUTH GUARD & BFCACHE SECURITY -->
    <script>
        (function() {
            function enforceAuth() {
                try {
                    var raw = localStorage.getItem("currentUser") || localStorage.getItem("intraWorldUser");
                    if (!raw) {
                        document.documentElement.style.display = "none";
                        window.location.replace("index.html");
                        return false;
                    }
                    var u = JSON.parse(raw);
                    if (!u || !u.email) {
                        localStorage.clear();
                        sessionStorage.clear();
                        document.documentElement.style.display = "none";
                        window.location.replace("index.html");
                        return false;
                    }
                    return true;
                } catch(e) {
                    localStorage.clear();
                    sessionStorage.clear();
                    document.documentElement.style.display = "none";
                    window.location.replace("index.html");
                    return false;
                }
            }
            if (!enforceAuth()) {
                if (document.documentElement) document.documentElement.style.display = "none";
            }
            window.addEventListener("pageshow", function(event) {
                enforceAuth();
            });
        })();
    </script>

            .floating-navbar { padding: 6px 8px; }

    </style>
</head>
