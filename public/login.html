<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntraWorld - Sign In</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #0f172a;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-top: 4px solid #800020;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(128, 0, 32, 0.08);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2px;
        }

        .brand-logo {
            width: 240px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.1));
        }

        .header h1 {
            letter-spacing: 0.5px;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #800020;
        }

        .header p {
            font-size: 15px;
            color: #64748b;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 14px;
            color: #334155;
            font-weight: 600;
        }

        .field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-wrapper .icon {
            position: absolute;
            left: 14px;
            color: #800020;
            font-size: 14px;
        }

        .field-wrapper input {
            width: 100%;
            padding: 12px 40px 12px 40px;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            color: #0f172a;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .field-wrapper input:focus {
            border-color: #800020;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(128, 0, 32, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: #800020;
        }

        .forgot-wrapper {
            display: flex;
            justify-content: flex-start;
            margin-top: 6px;
            width: 100%;
        }

        .forgot-link {
            font-size: 13px;
            color: #800020;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: #630517;
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 13px 20px;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #800020;
            box-shadow: 0 4px 12px rgba(128, 0, 32, 0.2);
            border-radius: 8px;
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-top: 24px;
            transition: all 0.2s ease;
        }

        .btn-submit:hover:not(:disabled) {
            box-shadow: 0 6px 16px rgba(128, 0, 32, 0.3);
            background: #630517;
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #64748b;
        }

        .footer-link a {
            color: #800020;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-link a:hover {
            color: #630517;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header">
            <div class="logo-container">
                <img src="logo.png" alt="IntraWorld Logo" class="brand-logo" onerror="this.style.display='none'">
            </div>
            <h1>Welcome</h1>
            <p>Sign in to continue to IntraWorld</p>
        </div>

        <div id="loginAlertBox" style="display: none; padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; align-items: center; gap: 10px;"></div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email or Username</label>
                <div class="field-wrapper">
                    <i class="fa-solid fa-envelope icon"></i>
                    <input type="text" id="email" name="email" placeholder="Student Email or Username" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="field-wrapper">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                </div>
                <div class="forgot-wrapper">
                    <a href="forgotpassword.html" class="forgot-link">Forgot Password?</a>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>
        </form>

        <div class="footer-link">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordField = document.getElementById('password');

        if (togglePassword && passwordField) {
            togglePassword.addEventListener('click', () => {
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);
                togglePassword.classList.toggle('fa-eye');
                togglePassword.classList.toggle('fa-eye-slash');
            });
        }
    </script>

    <script type="module" src="./js/login.js?v=4.0"></script>
</body>
</html>
