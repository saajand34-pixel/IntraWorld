<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntraWorld - Sign In</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Embedded Internal CSS -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #120307;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(136, 19, 55, 0.42) 0%, transparent 65%),
                radial-gradient(rgba(212, 175, 55, 0.07) 1px, transparent 1px);
            background-size: 100% 100%, 28px 28px;
            color: #ffffff;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: rgba(28, 6, 13, 0.94);
            border: 1px solid rgba(212, 175, 55, 0.28);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.75), 0 0 35px rgba(212, 175, 55, 0.12);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2px;
        }

        .brand-logo {
            width: 180px;
            height: auto;
            object-fit: contain;
            filter: none;
        }

        .header h1 {
            letter-spacing: 1px;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ffffff 40%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 15px;
            color: #94a3b8;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 15px;
            color: #cbd5e1;
            font-weight: 500;
        }

        .field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-wrapper .icon {
            position: absolute;
            left: 14px;
            color: #d4af37;
            font-size: 14px;
        }

        .field-wrapper input {
            width: 100%;
            padding: 12px 40px 12px 40px;
            background: #140307;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .field-wrapper input:focus {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.06);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            color: #64748b;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .toggle-password:hover {
            color: #d4af37;
        }

        .forgot-wrapper {
            display: flex;
            justify-content: flex-start;
            margin-top: 6px;
            width: 100%;
        }

        .forgot-link {
            font-size: 14px;
            color: #d4af37;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 13px 20px;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
            border-radius: 10px;
            color: #120307;
            border: none;
            cursor: pointer;
            font-weight: 700;
            margin-top: 24px;
            transition: all 0.3s ease;
        }

        .btn-submit:hover:not(:disabled) {
            box-shadow: 0 6px 22px rgba(212, 175, 55, 0.55);
            background: linear-gradient(135deg, #f59e0b, #d4af37);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 15px;
            color: #94a3b8;
        }

        .footer-link a {
            color: #d4af37;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header">
            <div class="logo-container">
                <img src="logo.png" alt="IntraWorld Logo" class="brand-logo" onerror="this.style.display='none'">
            </div>
            <h1>Welcome</h1>
            <p>Sign in to continue to IntraWorld</p>
        </div>

        <div id="loginAlertBox" style="display: none; padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; align-items: center; gap: 10px;"></div>

        <form id="loginForm">
    <div class="input-group">
        <label for="email">Email Address</label>
        <div class="field-wrapper">
            <i class="fa-solid fa-envelope icon"></i>
            <input type="email" id="email" name="email" placeholder="john@gmail.com" required>
        </div>
    </div>

    <div class="input-group">
        <label for="password">Password</label>
        <div class="field-wrapper">
            <i class="fa-solid fa-lock icon"></i>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
            <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
        </div>
        <div class="forgot-wrapper">
            <a href="forgotpassword.html" class="forgot-link">Forgot Password?</a>
        </div>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">
        <i class="fa-solid fa-right-to-bracket"></i> Login
    </button>
</form>

        <div class="footer-link">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordField = document.getElementById('password');

        if (togglePassword && passwordField) {
            togglePassword.addEventListener('click', () => {
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);
                togglePassword.classList.toggle('fa-eye');
                togglePassword.classList.toggle('fa-eye-slash');
            });
        }
    </script>

    <script type="module" src="./js/login.js?v=3.3"></script>
</body>
</html>
