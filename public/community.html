<!DOCTYPE html>
<html lang="en">
<head>
    <!-- BULLETPROOF AUTH GUARD & BFCACHE SECURITY -->
    <script>
        (function() {
            function enforceAuth() {
                try {
                    var raw = localStorage.getItem("currentUser") || localStorage.getItem("intraWorldUser");
                    if (!raw) {
                        document.documentElement.style.display = "none";
                        window.location.replace("index.html");
                        return false;
                    }
                    var u = JSON.parse(raw);
                    if (!u || !u.email) {
                        localStorage.clear();
                        sessionStorage.clear();
                        document.documentElement.style.display = "none";
                        window.location.replace("index.html");
                        return false;
                    }
                    return true;
                } catch(e) {
                    localStorage.clear();
                    sessionStorage.clear();
                    document.documentElement.style.display = "none";
                    window.location.replace("index.html");
                    return false;
                }
            }
            if (!enforceAuth()) {
                if (document.documentElement) document.documentElement.style.display = "none";
            }
            window.addEventListener("pageshow", function(event) {
                enforceAuth();
            });
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Community - Intra World</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            background: #f8fafc;
            color: #0f172a; 
            padding-top: 100px;
        }

        /* ===== FLOATING NAVBAR CONTAINER ===== */
        .nav-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: auto;
            max-width: 95%;
        }

        .floating-navbar {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(128, 0, 32, 0.18);
            padding: 8px 12px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .nav-links { display: flex; align-items: center; gap: 6px; }

        .nav-links a { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            padding: 10px 18px; 
            border-radius: 25px; 
            color: #475569; 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 500; 
            white-space: nowrap; 
            transition: all 0.2s ease; 
        }

        .nav-links a:hover { color: #800020; background: rgba(128, 0, 32, 0.08); }

        .nav-links a.active { 
            color: #ffffff; 
            background: #800020; 
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(128, 0, 32, 0.25);
            border: none;
        }

        .nav-links a.logout { 
            color: #ef4444; 
            background: rgba(239, 68, 68, 0.08);
            margin-left: 6px; 
        }

        .nav-links a.logout:hover { background: #ef4444; color: #ffffff; }

        /* Main Section */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .content { flex: 1; padding: 35px; width: 100%; max-width: 900px; margin: 0 auto; overflow-y: auto; }

        .card { 
            background: #ffffff; 
            border: 1px solid #e2e8f0; 
            border-top: 3px solid #800020;
            padding: 25px; 
            border-radius: 16px; 
            margin-bottom: 22px; 
            width: 100%; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .location-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .status-msg { font-size: 13px; color: #800020; margin-top: 4px; font-weight: 500; }

        .btn {
            background: #800020;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(128, 0, 32, 0.2);
        }

        .btn:hover { background: #630517; box-shadow: 0 6px 16px rgba(128, 0, 32, 0.3); }
        .btn:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; }

        /* College Pills Styling */
        .pills-title { font-size: 14px; font-weight: 600; color: #800020; margin-bottom: 12px; }
        .pills-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: thin;
            scrollbar-color: #800020 rgba(128, 0, 32, 0.1);
        }

        .pills-container::-webkit-scrollbar {
            height: 6px;
        }

        .pills-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        .pills-container::-webkit-scrollbar-thumb {
            background: #800020;
            border-radius: 10px;
        }

        .college-pill {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: #475569;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .college-pill:hover { color: #800020; border-color: #800020; background: rgba(128, 0, 32, 0.05); }

        .college-pill.active {
            background: #800020;
            color: #ffffff;
            font-weight: 700;
            border-color: #800020;
        }

        #college-search-input:focus {
            border-color: #800020 !important;
            box-shadow: 0 0 0 3px rgba(128, 0, 32, 0.1) !important;
        }

        .empty-feed { text-align: center; padding: 35px 20px; color: #64748b; }

        @media (max-width: 768px) {
            .nav-container { width: 95%; top: 10px; }
            .floating-navbar { padding: 6px 8px; }
            .nav-links a { padding: 8px 12px; font-size: 13px; }
            .nav-links a span { display: none; }
        }
    </style>
</head>
<body>

    <!-- FLOATING NAVBAR -->
    <div class="nav-container">
        <header class="floating-navbar">
            <nav class="nav-links">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
                <a href="connect.html"><i class="fa-solid fa-user-group"></i><span>Student Connect</span></a>
                <a href="posts.html"><i class="fa-solid fa-newspaper"></i><span>Posts</span></a>
                <a href="community.html"><i class="fa-solid fa-location-dot"></i><span>Community</span></a>
                <a href="messages.html"><i class="fa-solid fa-comments"></i><span>Messages</span></a>
                <a href="settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
                <a class="logout" id="logoutBtn" href="javascript:void(0);"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
            </nav>
        </header>
    </div>

    <!-- MAIN FEED CONTENT AREA -->
    <main class="main">
        <section class="content">

            <!-- Search Bar Container -->
            <div class="card search-banner" style="display: flex; flex-direction: column; gap: 14px;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div>
                        <h3 style="font-size: 1.25rem; font-weight: 700; color: #0f172a;"><i class="fa-solid fa-graduation-cap" style="color: #800020; margin-right: 8px;"></i> College Communities</h3>
                        <p style="font-size: 13px; color: #64748b; margin-top: 4px;">Search and explore campus feeds, events, elections, and student announcements.</p>
                    </div>
                </div>
                
                <div class="search-box-wrapper" style="position: relative; width: 100%;">
                    <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #800020; font-size: 15px;"></i>
                    <input type="text" id="college-search-input" placeholder="Search college name (e.g. SFGC, BMSIT, Jnana Jyothi, NMIT, RVCE...)" 
                        style="width: 100%; padding: 12px 42px 12px 45px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 10px; color: #0f172a; font-size: 14px; outline: none; transition: all 0.2s;" />
                    <button id="clear-search-btn" style="display: none; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #64748b; cursor: pointer; font-size: 16px;">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- Available College Communities Pills Bar -->
            <div id="colleges-wrapper" class="card">
                <div class="pills-title" id="pills-header-title">Campus Communities:</div>
                <div id="college-pills-container" class="pills-container"></div>
            </div>

            <!-- Feed Container -->
            <div id="feed-container"></div>

        </section>
    </main>

    <!-- AUTOMATIC NAVBAR HIGHLIGHTING -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const currentFileName = window.location.pathname.split("/").pop() || "community.html";
            document.querySelectorAll(".nav-links a").forEach(link => {
                link.classList.remove("active");
                if (link.getAttribute("href") === currentFileName) {
                    link.classList.add("active");
                }
            });
        });
    </script>

    <!-- WhatsApp-Style Full Image Lightbox Modal -->
    <div id="imageLightboxModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); z-index: 3000; align-items: center; justify-content: center; padding: 20px;">
        <button id="closeLightboxBtn" type="button" style="position: absolute; top: 20px; right: 24px; background: rgba(255,255,255,0.25); border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 3010; transition: background 0.2s;" title="Close">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <a id="downloadLightboxBtn" href="#" download="community-photo.jpg" target="_blank" rel="noopener noreferrer" style="position: absolute; top: 20px; right: 80px; background: rgba(128, 0, 32, 0.2); border: 1px solid rgba(128, 0, 32, 0.4); color: #800020; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; z-index: 3010; text-decoration: none; transition: background 0.2s;" title="Download photo">
            <i class="fa-solid fa-download"></i>
        </a>
        <img id="lightboxImg" src="" style="max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); border: 2px solid #800020; cursor: zoom-out;" alt="Full Preview">
    </div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth-check.js"></script>
    <script type="module" src="js/community.js?v=3.3"></script>
</body>
</html>
