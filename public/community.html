<!DOCTYPE html>
<html lang="en">
<head>
    <!-- BULLETPROOF AUTH GUARD & BFCACHE SECURITY -->
    <script>
        (function() {
            function enforceAuth() {
                try {
                    var raw = localStorage.getItem("currentUser") || localStorage.getItem("intraWorldUser");
                    if (!raw) {
                        document.documentElement.style.display = "none";
                        window.location.replace("index.html");
                        return false;
                    }
                    var u = JSON.parse(raw);
                    if (!u || !u.email) {
                        localStorage.clear();
                        sessionStorage.clear();
                        document.documentElement.style.display = "none";
                        window.location.replace("index.html");
                        return false;
                    }
                    return true;
                } catch(e) {
                    localStorage.clear();
                    sessionStorage.clear();
                    document.documentElement.style.display = "none";
                    window.location.replace("index.html");
                    return false;
                }
            }
            if (!enforceAuth()) {
                if (document.documentElement) document.documentElement.style.display = "none";
            }
            window.addEventListener("pageshow", function(event) {
                enforceAuth();
            });
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Community - Intra World</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            background-color: #120307;
            background-image: radial-gradient(circle at 50% 0%, rgba(136, 19, 55, 0.42) 0%, transparent 65%), radial-gradient(rgba(212, 175, 55, 0.07) 1px, transparent 1px);
            background-size: 100% 100%, 28px 28px; 
            color: #ffffff; 
            padding-top: 100px;
        }

        /* ===== FLOATING NAVBAR CONTAINER ===== */
        .nav-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: auto;
            max-width: 95%;
        }

        .floating-navbar {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(26, 6, 13, 0.92);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(212, 175, 55, 0.22);
            padding: 8px 12px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75), inset 0 0 0 1px rgba(212, 175, 55, 0.15);
        }

        .nav-links { display: flex; align-items: center; gap: 6px; }

        .nav-links a { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            padding: 10px 18px; 
            border-radius: 25px; 
            color: #cbb3ba; 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 500; 
            white-space: nowrap; 
            transition: all 0.2s ease; 
        }

        .nav-links a:hover { color: #d4af37; background: rgba(212, 175, 55, 0.1); }

        .nav-links a.active { 
            color: #120307; 
            background: linear-gradient(135deg, #d4af37, #b8860b); 
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
        }

        .nav-links a.logout { 
            color: #ef4444; 
            background: rgba(239, 68, 68, 0.1);
            margin-left: 6px; 
        }

        .nav-links a.logout:hover { background: #ef4444; color: #ffffff; }

        /* Main Section */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .content { flex: 1; padding: 35px; width: 100%; max-width: 900px; margin: 0 auto; overflow-y: auto; }

        .card { 
            background: #1c060d; 
            border: 1px solid rgba(212, 175, 55, 0.18); 
            padding: 25px; 
            border-radius: 16px; 
            margin-bottom: 22px; 
            width: 100%; 
        }

        .location-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .status-msg { font-size: 13px; color: #d4af37; margin-top: 4px; }

        .btn {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #120307;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
        }

        .btn:hover { background: linear-gradient(135deg, #f59e0b, #d4af37); }
        .btn:disabled { background: rgba(255,255,255,0.1); color: #8fa8bf; cursor: not-allowed; }

        /* College Pills Styling */
        .pills-title { font-size: 14px; font-weight: 500; color: #d4af37; margin-bottom: 12px; }
        .pills-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: thin;
            scrollbar-color: #d4af37 rgba(212, 175, 55, 0.1);
        }

        .pills-container::-webkit-scrollbar {
            height: 6px;
        }

        .pills-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .pills-container::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 10px;
        }

        .college-pill {
            background: #16040a;
            border: 1px solid rgba(212, 175, 55, 0.18);
            color: #cbb3ba;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .college-pill:hover { color: #ffffff; background: rgba(212, 175, 55, 0.12); }

        .college-pill.active {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #120307;
            font-weight: 700;
            border-color: #d4af37;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.35);
        }

        #college-search-input:focus {
            border-color: #0066ff !important;
            box-shadow: 0 0 15px rgba(0, 102, 255, 0.3) !important;
        }

        .empty-feed { text-align: center; padding: 35px 20px; }

        @media (max-width: 768px) {
            .nav-container { width: 95%; top: 10px; }
            .floating-navbar { padding: 6px 8px; }
            .nav-links a { padding: 8px 12px; font-size: 13px; }
            .nav-links a span { display: none; }
        }
    </style>
</head>
<body>

    <!-- FLOATING NAVBAR -->
    <div class="nav-container">
        <header class="floating-navbar">
            <nav class="nav-links">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
                <a href="connect.html"><i class="fa-solid fa-user-group"></i><span>Student Connect</span></a>
                <a href="posts.html"><i class="fa-solid fa-newspaper"></i><span>Posts</span></a>
                <a href="community.html"><i class="fa-solid fa-location-dot"></i><span>Community</span></a>
                <a href="messages.html"><i class="fa-solid fa-comments"></i><span>Messages</span></a>
                <a href="settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
                <a class="logout" id="logoutBtn" href="javascript:void(0);"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
            </nav>
        </header>
    </div>

    <!-- MAIN FEED CONTENT AREA -->
    <main class="main">
        <section class="content">

            <!-- Search Bar Container -->
            <div class="card search-banner" style="display: flex; flex-direction: column; gap: 14px;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div>
                        <h3 style="font-size: 1.25rem; font-weight: 600;"><i class="fa-solid fa-graduation-cap" style="color: #0066ff; margin-right: 8px;"></i> College Communities</h3>
                        <p style="font-size: 13px; color: #8fa8bf; margin-top: 4px;">Search and explore campus feeds, events, elections, and student announcements.</p>
                    </div>
                </div>
                
                <div class="search-box-wrapper" style="position: relative; width: 100%;">
                    <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 15px;"></i>
                    <input type="text" id="college-search-input" placeholder="Search college name (e.g. SFGC, BMSIT, Jnana Jyothi, NMIT, RVCE...)" 
                        style="width: 100%; padding: 12px 42px 12px 45px; background: #0c233c; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; color: #fff; font-size: 14px; outline: none; transition: all 0.2s;" />
                    <button id="clear-search-btn" style="display: none; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #8fa8bf; cursor: pointer; font-size: 16px;">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- Available College Communities Pills Bar -->
            <div id="colleges-wrapper" class="card">
                <div class="pills-title" id="pills-header-title">Campus Communities:</div>
                <div id="college-pills-container" class="pills-container"></div>
            </div>

            <!-- Feed Container -->
            <div id="feed-container"></div>

        </section>
    </main>

    <!-- AUTOMATIC NAVBAR HIGHLIGHTING -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const currentFileName = window.location.pathname.split("/").pop() || "community.html";
            document.querySelectorAll(".nav-links a").forEach(link => {
                link.classList.remove("active");
                if (link.getAttribute("href") === currentFileName) {
                    link.classList.add("active");
                }
            });
        });
    </script>

    
    

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth-check.js"></script>
    <script type="module" src="js/community.js?v=3.3"></script>
</body>
</html>
