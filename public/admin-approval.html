<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Admin Auth Guard -->
    <script>
        (function() {
            function enforceAdminAuth() {
                try {
                    var raw = localStorage.getItem("currentUser") || localStorage.getItem("intraWorldUser");
                    if (!raw) { document.documentElement.style.display = "none"; window.location.replace("login.html"); return false; }
                    var u = JSON.parse(raw);
                    if (!u || (u.role !== "admin" && u.email !== "admin@intraworld.com" && u.email !== "saajand34@gmail.com")) {
                        document.documentElement.style.display = "none"; window.location.replace("index.html"); return false;
                    }
                    return true;
                } catch(e) { localStorage.clear(); sessionStorage.clear(); document.documentElement.style.display = "none"; window.location.replace("index.html"); return false; }
            }
            if (!enforceAdminAuth()) { if (document.documentElement) document.documentElement.style.display = "none"; }
            window.addEventListener("pageshow", enforceAdminAuth);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Admin Approval — IntraWorld</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            min-height: 100vh;
            background: #36050e;
            color: #ffffff;
            padding-top: 90px;
            padding-bottom: 60px;
        }

        /* ====== NAVBAR ====== */
        .nav-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(34, 3, 8, 0.97);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(245, 158, 11, 0.25);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 700;
            color: #f59e0b;
            text-decoration: none;
        }

        .nav-links { display: flex; gap: 8px; }
        .nav-links a {
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #d6d3d1;
            text-decoration: none;
            transition: all 0.18s;
            border: 1px solid transparent;
        }
        .nav-links a:hover { color: #f59e0b; background: rgba(245,158,11,0.1); }
        .nav-links a.active {
            color: #180206;
            background: linear-gradient(135deg, #ffd700, #f59e0b);
            border-color: rgba(245,158,11,0.4);
        }

        /* ====== PAGE WRAPPER ====== */
        .page-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: #f59e0b;
        }

        .page-title small {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            font-weight: 400;
            margin-top: 2px;
        }

        /* ====== STAT CHIPS ====== */
        .stats-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .stat-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(245,158,11,0.2);
            border-radius: 14px;
            padding: 12px 18px;
            min-width: 130px;
            cursor: pointer;
            transition: all 0.18s;
        }
        .stat-chip:hover, .stat-chip.active { border-color: rgba(245,158,11,0.6); background: rgba(245,158,11,0.08); }

        .stat-chip .stat-icon {
            width: 38px; height: 38px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px;
        }
        .stat-chip .stat-num { font-size: 22px; font-weight: 700; line-height: 1; }
        .stat-chip .stat-label { font-size: 11px; color: #94a3b8; margin-top: 1px; }

        .chip-pending  .stat-icon { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .chip-approved .stat-icon { background: rgba(16,185,129,0.15);  color: #10b981; }
        .chip-rejected .stat-icon { background: rgba(239,68,68,0.12);   color: #ef4444; }
        .chip-total    .stat-icon { background: rgba(56,189,248,0.12);   color: #38bdf8; }

        .chip-pending  .stat-num  { color: #f59e0b; }
        .chip-approved .stat-num  { color: #10b981; }
        .chip-rejected .stat-num  { color: #ef4444; }
        .chip-total    .stat-num  { color: #38bdf8; }

        /* ====== TOOLBAR ====== */
        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-wrap {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-wrap i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 14px;
        }

        .search-wrap input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(245,158,11,0.2);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 13px;
            outline: none;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.18s;
        }
        .search-wrap input:focus { border-color: #f59e0b; }
        .search-wrap input::placeholder { color: #64748b; }

        .filter-tabs {
            display: flex;
            gap: 6px;
        }

        .filter-tab {
            padding: 8px 16px;
            border-radius: 9px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #94a3b8;
            transition: all 0.18s;
        }
        .filter-tab:hover { color: #f59e0b; border-color: rgba(245,158,11,0.35); }
        .filter-tab.active { background: rgba(245,158,11,0.15); color: #f59e0b; border-color: rgba(245,158,11,0.5); }

        .refresh-btn {
            padding: 9px 18px;
            border-radius: 9px;
            border: 1px solid rgba(56,189,248,0.3);
            background: rgba(56,189,248,0.08);
            color: #38bdf8;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s;
            font-family: 'Poppins', sans-serif;
        }
        .refresh-btn:hover { background: rgba(56,189,248,0.15); }

        /* ====== CARD GRID ====== */
        #approvalCardGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
        }

        .approval-card {
            background: rgba(22, 3, 7, 0.9);
            border: 1px solid rgba(245, 158, 11, 0.18);
            border-radius: 16px;
            padding: 18px;
            transition: border-color 0.18s, box-shadow 0.18s;
        }
        .approval-card:hover {
            border-color: rgba(245, 158, 11, 0.4);
            box-shadow: 0 8px 28px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav class="nav-bar">
        <a href="admin.html" class="nav-logo">
            <img src="logo.png" alt="IntraWorld" style="height:30px;">
            <span>Admin Panel</span>
        </a>
        <div class="nav-links">
            <a href="admin.html"><i class="fa-solid fa-database"></i> View Database</a>
            <a href="admin-approval.html" class="active"><i class="fa-solid fa-user-shield"></i> Approvals</a>
            <a href="index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i> Exit</a>
        </div>
    </nav>

    <div class="page-wrap">

        <!-- Header -->
        <div class="page-header">
            <div class="page-title">
                <i class="fa-solid fa-user-shield"></i> Student Account Approvals
                <small>Review and approve or reject new student registrations before they can login.</small>
            </div>
            <button class="refresh-btn" id="refreshBtn">
                <i class="fa-solid fa-rotate-right"></i> Refresh
            </button>
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-chip chip-pending filter-tab active" data-filter="pending">
                <div class="stat-icon"><i class="fa-solid fa-clock"></i></div>
                <div>
                    <div class="stat-num" id="pendingCount">—</div>
                    <div class="stat-label">Pending</div>
                </div>
            </div>
            <div class="stat-chip chip-approved filter-tab" data-filter="approved">
                <div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div>
                <div>
                    <div class="stat-num" id="approvedCount">—</div>
                    <div class="stat-label">Approved</div>
                </div>
            </div>
            <div class="stat-chip chip-rejected filter-tab" data-filter="rejected">
                <div class="stat-icon"><i class="fa-solid fa-ban"></i></div>
                <div>
                    <div class="stat-num" id="rejectedCount">—</div>
                    <div class="stat-label">Rejected</div>
                </div>
            </div>
            <div class="stat-chip chip-total filter-tab" data-filter="all">
                <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                <div>
                    <div class="stat-num" id="totalCount">—</div>
                    <div class="stat-label">All</div>
                </div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="approvalSearch" placeholder="Search by name, email, or college...">
            </div>
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="pending">⏳ Pending</button>
                <button class="filter-tab" data-filter="approved">✅ Approved</button>
                <button class="filter-tab" data-filter="rejected">❌ Rejected</button>
                <button class="filter-tab" data-filter="all">All</button>
            </div>
        </div>

        <!-- Card Grid -->
        <div id="approvalCardGrid">
            <div style="grid-column:1/-1;text-align:center;color:#f59e0b;padding:40px;">Loading...</div>
        </div>

    </div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/admin-approval.js?v=1.0"></script>
</body>
</html>
