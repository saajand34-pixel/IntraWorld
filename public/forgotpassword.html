<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntraWorld - Forgot Password</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #030712;
            background-image: radial-gradient(rgba(56, 189, 248, 0.15) 1px, transparent 1px);
            background-size: 24px 24px;
            color: #ffffff;
            padding: 20px;
        }

        .recovery-card {
            width: 100%;
            max-width: 480px;
            padding: 40px;
            background: rgba(10, 22, 40, 0.75);
            border: 1px solid rgba(0, 140, 255, 0.25);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0, 102, 255, 0.15), 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 6px; }
        .header p { font-size: 14px; color: #94a3b8; }

        .input-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 14px; color: #cbd5e1; font-weight: 500; }
        .field-wrapper { position: relative; display: flex; align-items: center; }
        .field-wrapper i { position: absolute; left: 14px; color: #38bdf8; font-size: 14px; }
        .field-wrapper input {
            width: 100%; padding: 12px 14px 12px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px; color: #ffffff; font-size: 14px; outline: none; transition: 0.3s;
        }
        .field-wrapper input:focus { border-color: #38bdf8; background: rgba(0, 136, 255, 0.1); }

        .btn-submit {
            width: 100%; padding: 14px; margin-top: 10px; font-size: 15px; font-weight: 600;
            color: #fff; border: none; border-radius: 10px; cursor: pointer;
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            box-shadow: 0 0 15px rgba(0, 102, 255, 0.4); transition: 0.3s;
        }
        .btn-submit:hover { box-shadow: 0 0 25px rgba(0, 102, 255, 0.7); }

        .footer-link { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
        .footer-link a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="recovery-card">
        <div class="header">
            <h1>Reset Password</h1>
            <p>Verify security details associated with your account</p>
        </div>

        <form id="recoveryForm">
            <div class="input-group">
                <label>Registered Email</label>
                <div class="field-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="recoveryEmail" placeholder="name@company.com" required>
                </div>
            </div>

            <div class="input-group">
                <label>Favourite Sport</label>
                <div class="field-wrapper">
                    <i class="fa-solid fa-futbol"></i>
                    <input type="text" id="recoverySport" placeholder="Enter favourite sport" required>
                </div>
            </div>

            <div class="input-group">
                <label>Primary Ambition</label>
                <div class="field-wrapper">
                    <i class="fa-solid fa-bullseye"></i>
                    <input type="text" id="recoveryAmbition" placeholder="Enter primary ambition" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="resetBtn">Verify & Reset Password</button>
        </form>

        <div class="footer-link">
            Remembered password? <a href="index.html">Sign In</a>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const recoveryForm = document.getElementById("recoveryForm");

        recoveryForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const emailInput = document.getElementById("recoveryEmail").value.trim().toLowerCase();
            const sportInput = document.getElementById("recoverySport").value.trim().toLowerCase();
            const ambitionInput = document.getElementById("recoveryAmbition").value.trim().toLowerCase();

            try {
                const q = query(collection(db, "users"), where("email", "==", emailInput));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    alert("No account found with this email.");
                    return;
                }

                let userData = null;
                querySnapshot.forEach((doc) => {
                    userData = doc.data();
                });

                const storedSport = (userData.favouriteSport || "").trim().toLowerCase();
                const storedAmbition = (userData.ambition || "").trim().toLowerCase();

                if (sportInput === storedSport && ambitionInput === storedAmbition) {
                    await sendPasswordResetEmail(auth, emailInput);
                    alert("Security details verified successfully! A password reset link has been sent to your email.");
                    window.location.href = "index.html";
                } else {
                    alert("Verification failed: Answers do not match our records.");
                }

            } catch (error) {
                console.error("Recovery Error:", error);
                alert("Error verifying details: " + error.message);
            }
        });
    </script>
</body>
</html>
