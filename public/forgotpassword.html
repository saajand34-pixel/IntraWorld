<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntraWorld - Forgot Password</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #120307;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(136, 19, 55, 0.42) 0%, transparent 65%),
                radial-gradient(rgba(212, 175, 55, 0.07) 1px, transparent 1px);
            background-size: 100% 100%, 28px 28px;
            color: #ffffff;
            padding: 20px;
        }

        .recovery-card {
            width: 100%;
            max-width: 480px;
            padding: 40px;
            background: rgba(28, 6, 13, 0.94);
            border: 1px solid rgba(212, 175, 55, 0.28);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.75), 0 0 35px rgba(212, 175, 55, 0.12);
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { 
            font-size: 26px; 
            font-weight: 700; 
            background: linear-gradient(135deg, #ffffff 40%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px; 
        }
        .header p { font-size: 14px; color: #94a3b8; }

        .input-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 14px; color: #cbd5e1; font-weight: 500; }
        .field-wrapper { position: relative; display: flex; align-items: center; }
        .field-wrapper i { position: absolute; left: 14px; color: #d4af37; font-size: 14px; }
        .field-wrapper input {
            width: 100%; padding: 12px 14px 12px 40px;
            background: #140307;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px; color: #ffffff; font-size: 14px; outline: none; transition: 0.3s;
        }
        .field-wrapper input:focus { border-color: #d4af37; background: rgba(212, 175, 55, 0.06); }

        .btn-submit {
            width: 100%; padding: 14px; margin-top: 10px; font-size: 15px; font-weight: 700;
            color: #120307; border: none; border-radius: 10px; cursor: pointer;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35); transition: 0.3s;
        }
        .btn-submit:hover:not(:disabled) { box-shadow: 0 6px 22px rgba(212, 175, 55, 0.55); background: linear-gradient(135deg, #f59e0b, #d4af37); transform: translateY(-1px); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .footer-link { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
        .footer-link a { color: #d4af37; text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }

        .hidden { display: none !important; }
        .status-badge {
            padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px;
            background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #34d399;
        }
    </style>
</head>
<body>

    <div class="recovery-card">
        <div class="header">
            <h1>Reset Password</h1>
            <p>Verify security details associated with your account</p>
        </div>

        <div id="statusAlert" class="status-badge hidden"></div>

        <!-- Step 1: Security Question Verification Form -->
        <form id="recoveryForm">
            <div class="input-group">
                <label>Registered Email</label>
                <div class="field-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="recoveryEmail" placeholder="your.email@gmail.com" required>
                </div>
            </div>

            <div class="input-group">
                <label>Favourite Sport <span style="font-size: 11px; color: #94a3b8;">(Case-Insensitive)</span></label>
                <div class="field-wrapper">
                    <i class="fa-solid fa-futbol"></i>
                    <input type="text" id="recoverySport" placeholder="e.g. Cricket, Football" required>
                </div>
            </div>

            <div class="input-group">
                <label>Primary Ambition <span style="font-size: 11px; color: #94a3b8;">(Case-Insensitive)</span></label>
                <div class="field-wrapper">
                    <i class="fa-solid fa-bullseye"></i>
                    <input type="text" id="recoveryAmbition" placeholder="e.g. Software Engineer" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="resetBtn">Verify Security Details</button>
        </form>

        <!-- Step 2: New Password Form (Appears when verified) -->
        <form id="newPasswordForm" class="hidden" onsubmit="handleSetNewPassword(event)">
            <div class="input-group">
                <label>New Password</label>
                <div class="field-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="newPassword" placeholder="Enter new password" required minlength="6">
                </div>
            </div>

            <div class="input-group">
                <label>Confirm New Password</label>
                <div class="field-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmNewPassword" placeholder="Re-enter new password" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn-submit" id="savePasswordBtn">Update Password</button>
        </form>

        <div class="footer-link">
            Remembered password? <a href="login.html">Sign In</a>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyATrNL8GcNhpLN9uSDQmmd0qNXh40JO4rA",
            authDomain: "intraworld.firebaseapp.com",
            projectId: "intraworld",
            storageBucket: "intraworld.firebasestorage.app",
            messagingSenderId: "547389253115",
            appId: "1:547389253115:web:35bfdddadea59e298d175e",
            measurementId: "G-LQ7MKELRT3"
        };

        let db = null;
        if (typeof firebase !== 'undefined') {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        }

        let verifiedUserEmail = null;

        const recoveryForm = document.getElementById("recoveryForm");

        recoveryForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            // Case-Insensitive Normalization
            const emailInput = document.getElementById("recoveryEmail").value.trim().toLowerCase();
            const sportInput = document.getElementById("recoverySport").value.trim().toLowerCase();
            const ambitionInput = document.getElementById("recoveryAmbition").value.trim().toLowerCase();
            const resetBtn = document.getElementById("resetBtn");

            resetBtn.disabled = true;
            resetBtn.innerText = "Verifying with Database...";

            try {
                if (!db) {
                    throw new Error("Firestore database is connecting. Please refresh.");
                }

                let userData = null;

                // 1. Check registrations collection
                try {
                    const regSnap = await db.collection("registrations").where("email", "==", emailInput).get();
                    if (!regSnap.empty) {
                        userData = regSnap.docs[0].data();
                    }
                } catch (err) {
                    console.warn("Registrations query note:", err.message);
                }

                // 2. Check students collection
                if (!userData || !userData.favouriteSport) {
                    try {
                        const studSnap = await db.collection("students").where("email", "==", emailInput).get();
                        if (!studSnap.empty) {
                            userData = { ...studSnap.docs[0].data(), ...userData };
                        }
                    } catch (err) {
                        console.warn("Students query note:", err.message);
                    }
                }

                // 3. Check users collection
                if (!userData || !userData.favouriteSport) {
                    try {
                        const userDoc = await db.collection("users").doc(emailInput).get();
                        if (userDoc.exists) {
                            userData = { ...userDoc.data(), ...userData };
                        } else {
                            const userSnap = await db.collection("users").where("email", "==", emailInput).get();
                            if (!userSnap.empty) {
                                userData = { ...userSnap.docs[0].data(), ...userData };
                            }
                        }
                    } catch (err) {
                        console.warn("Users query note:", err.message);
                    }
                }

                if (!userData) {
                    alert("❌ No student account found with this email address.");
                    resetBtn.disabled = false;
                    resetBtn.innerText = "Verify Security Details";
                    return;
                }

                // Case-Insensitive Comparison of Security Questions
                const storedSport = (userData.favouriteSport || "").trim().toLowerCase();
                const storedAmbition = (userData.ambition || "").trim().toLowerCase();

                if (sportInput === storedSport && ambitionInput === storedAmbition) {
                    verifiedUserEmail = emailInput;
                    
                    // Show New Password Input
                    recoveryForm.classList.add("hidden");
                    document.getElementById("newPasswordForm").classList.remove("hidden");
                    
                    const statusAlert = document.getElementById("statusAlert");
                    statusAlert.innerText = "✅ Security details verified! Enter your new password below.";
                    statusAlert.classList.remove("hidden");
                } else {
                    alert("❌ Verification failed: Security answers do not match our records. Please try again.");
                    resetBtn.disabled = false;
                    resetBtn.innerText = "Verify Security Details";
                }

            } catch (error) {
                console.error("Recovery Error:", error);
                alert("Error verifying details: " + error.message);
                resetBtn.disabled = false;
                resetBtn.innerText = "Verify Security Details";
            }
        });

        async function handleSetNewPassword(event) {
            event.preventDefault();

            const p1 = document.getElementById("newPassword").value.trim();
            const p2 = document.getElementById("confirmNewPassword").value.trim();
            const saveBtn = document.getElementById("savePasswordBtn");

            if (p1 !== p2) {
                alert("Passwords do not match. Please re-enter.");
                return;
            }

            if (!p1 || p1.length < 6) {
                alert("Password must be at least 6 characters long.");
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerText = "Updating Password in All Database Records...";

            try {
                const email = verifiedUserEmail.toLowerCase();
                const now = new Date().toISOString();

                // 1. Update all documents in 'registrations'
                try {
                    const regSnap = await db.collection("registrations").where("email", "==", email).get();
                    for (const doc of regSnap.docs) {
                        await db.collection("registrations").doc(doc.id).update({
                            password: p1,
                            passwordUpdatedAt: now
                        });
                    }
                } catch (e) {
                    console.warn("Update registrations error:", e);
                }

                // 2. Update all documents in 'students'
                try {
                    const studSnap = await db.collection("students").where("email", "==", email).get();
                    for (const doc of studSnap.docs) {
                        await db.collection("students").doc(doc.id).update({
                            password: p1,
                            passwordUpdatedAt: now
                        });
                    }
                } catch (e) {
                    console.warn("Update students error:", e);
                }

                // 3. Update 'users' collection
                try {
                    await db.collection("users").doc(email).set({
                        password: p1,
                        passwordUpdatedAt: now
                    }, { merge: true });

                    const userSnap = await db.collection("users").where("email", "==", email).get();
                    for (const doc of userSnap.docs) {
                        await db.collection("users").doc(doc.id).update({
                            password: p1,
                            passwordUpdatedAt: now
                        });
                    }
                } catch (e) {
                    console.warn("Update users error:", e);
                }

                alert("🎉 Password updated successfully! You can now log in with your new password.");
                window.location.href = "login.html";
            } catch (err) {
                console.error("Password update error:", err);
                alert("Error updating password: " + err.message);
                saveBtn.disabled = false;
                saveBtn.innerText = "Update Password";
            }
        }
    </script>
</body>
</html>
