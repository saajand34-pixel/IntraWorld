<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Admin Authentication & Session Verification -->
    <script>
        (function() {
            function enforceAdminAuth() {
                try {
                    var raw = localStorage.getItem("currentUser") || localStorage.getItem("intraWorldUser");
                    if (!raw) {
                        document.documentElement.style.display = "none";
                        window.location.replace("login.html");
                        return false;
                    }
                    var u = JSON.parse(raw);
                    if (!u || (u.role !== "admin" && u.email !== "admin@intraworld.com")) {
                        document.documentElement.style.display = "none";
                        window.location.replace("index.html");
                        return false;
                    }
                    return true;
                } catch(e) {
                    localStorage.clear();
                    sessionStorage.clear();
                    document.documentElement.style.display = "none";
                    window.location.replace("index.html");
                    return false;
                }
            }
            if (!enforceAdminAuth()) {
                if (document.documentElement) document.documentElement.style.display = "none";
            }
            window.addEventListener("pageshow", function(event) {
                enforceAdminAuth();
            });
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntraWorld Admin Dashboard</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f8fafc;
            color: #0f172a;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #ffffff;
            border-bottom: 2px solid #800020;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        header h1 {
            font-size: 24px;
            color: #800020;
            font-weight: 700;
        }

        header button {
            padding: 10px 22px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        header button:hover {
            background: #b91c1c;
        }

        .container {
            padding: 35px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 35px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-top: 3px solid #800020;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .card h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: #800020;
            font-weight: 600;
        }

        .card span {
            font-size: 36px;
            font-weight: 700;
            color: #0f172a;
        }

        .section-title {
            margin: 30px 0 15px 0;
            font-size: 20px;
            color: #800020;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .search {
            margin-bottom: 25px;
        }

        .search input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1.5px solid #cbd5e1;
            font-size: 14px;
            background: #ffffff;
            color: #0f172a;
            outline: none;
            transition: border-color 0.2s;
        }
        .search input:focus {
            border-color: #800020;
            box-shadow: 0 0 0 3px rgba(128, 0, 32, 0.1);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 14px;
            margin-bottom: 30px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            white-space: nowrap;
        }

        thead {
            background: #800020;
            color: #ffffff;
        }

        th {
            padding: 14px 16px;
            font-size: 13px;
            text-align: center;
            font-weight: 600;
            color: #ffffff;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
            text-align: center;
            font-size: 13px;
            color: #334155;
        }

        img.profile {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #800020;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-verified { background: rgba(5, 150, 105, 0.1); color: #059669; border: 1px solid rgba(5, 150, 105, 0.3); }

        .delete {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            color: #dc2626;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .delete:hover {
            background: #dc2626;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>IntraWorld Admin Dashboard</h1>
        <div style="display:flex;gap:10px;align-items:center;">
            <a href="admin-approval.html" style="padding:9px 18px;border-radius:8px;background:rgba(128, 0, 32, 0.08);border:1px solid rgba(128, 0, 32, 0.25);color:#800020;font-size:13px;font-weight:600;text-decoration:none;">
                <i class="fa-solid fa-user-shield"></i> Approval Queue
            </a>
            <button id="logoutBtn" onclick="if(window.secureLogout)window.secureLogout(event);else{localStorage.clear();sessionStorage.clear();window.location.replace('index.html');}">Logout</button>
        </div>
    </header>

    <div class="container">
        <!-- Stats Summary -->
        <div class="cards">
            <div class="card">
                <h2>Total Members</h2>
                <span id="totalUsers">0</span>
            </div>
            <div class="card">
                <h2>OCR Verified</h2>
                <span id="ocrVerifiedUsers">0</span>
            </div>
            <div class="card">
                <h2>Verified Users</h2>
                <span id="verifiedUsers">0</span>
            </div>
        </div>

        <!-- MEMBERS DATABASE TABLE -->
        <h2 class="section-title"><i class="fa-solid fa-users"></i> All Database Members</h2>
        
        <div class="search">
            <input type="text" id="search" placeholder="Search by Name, Email, College, State or Qualification...">
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>Full Name</th>
                        <th>Gender</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Qualification</th>
                        <th>College / University</th>
                        <th>Passout Year</th>
                        <th>Registered Date</th>
                        <th>Status</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>
    </div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth-check.js"></script>
    <script type="module" src="js/admin.js?v=2.0"></script>
</body>
</html>
