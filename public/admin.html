<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Admin Authentication & Session Verification -->
    <script>
        (function() {
            function enforceAdminAuth() {
                try {
                    var raw = localStorage.getItem("currentUser") || localStorage.getItem("intraWorldUser");
                    if (!raw) {
                        document.documentElement.style.display = "none";
                        window.location.replace("login.html");
                        return false;
                    }
                    var u = JSON.parse(raw);
                    if (!u || (u.role !== "admin" && u.email !== "admin@intraworld.com")) {
                        document.documentElement.style.display = "none";
                        window.location.replace("index.html");
                        return false;
                    }
                    return true;
                } catch(e) {
                    localStorage.clear();
                    sessionStorage.clear();
                    document.documentElement.style.display = "none";
                    window.location.replace("index.html");
                    return false;
                }
            }
            if (!enforceAdminAuth()) {
                if (document.documentElement) document.documentElement.style.display = "none";
            }
            window.addEventListener("pageshow", function(event) {
                enforceAdminAuth();
            });
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntraWorld Admin Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #36050e;
            background: #36050e;
            color: #ffffff;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(26, 6, 13, 0.96);
            border-bottom: 1px solid rgba(245, 158, 11, 0.35);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #ffffff 40%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header button {
            padding: 12px 24px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        header button:hover {
            background: #d91f1f;
        }

        .container {
            padding: 35px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 35px;
        }

        .card {
            background: #220308;
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #f59e0b;
        }

        .card span {
            font-size: 38px;
            font-weight: 700;
        }

        .section-title {
            margin: 30px 0 15px 0;
            font-size: 20px;
            color: #f59e0b;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search {
            margin-bottom: 25px;
        }

        .search input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(245, 158, 11, 0.25);
            font-size: 16px;
            background: #36050e;
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }
        .search input:focus {
            border-color: #f59e0b;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 16px;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #220308;
            border: 1px solid rgba(245, 158, 11, 0.3);
            white-space: nowrap;
        }

        thead {
            background: linear-gradient(135deg, #c41226, #4d000a);
            border-bottom: 2px solid #f59e0b;
        }

        th {
            padding: 16px;
            font-size: 14px;
            text-align: center;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            font-size: 13px;
        }

        img.profile {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-verified { background: #16a34a; color: #fff; }

        .delete {
            background: #ff3b3b;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        .delete:hover {
            background: #d91f1f;
        }
    </style>
</head>
<body>

    <header>
        <h1>IntraWorld Admin Dashboard</h1>
        <button id="logoutBtn" onclick="if(window.secureLogout)window.secureLogout(event);else{localStorage.clear();sessionStorage.clear();window.location.replace('index.html');}">Logout</button>
    </header>

    <div class="container">
        <!-- Stats Summary -->
        <div class="cards">
            <div class="card">
                <h2>Total Members</h2>
                <span id="totalUsers">0</span>
            </div>
            <div class="card">
                <h2>OCR Verified</h2>
                <span id="ocrVerifiedUsers">0</span>
            </div>
            <div class="card">
                <h2>Verified Users</h2>
                <span id="verifiedUsers">0</span>
            </div>
        </div>

        <!-- MEMBERS DATABASE TABLE -->
        <h2 class="section-title"><i class="fa-solid fa-users"></i> All Database Members</h2>
        
        <div class="search">
            <input type="text" id="search" placeholder="Search by Name, Email, College, State or Qualification...">
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Qualification</th>
                        <th>College / University</th>
                        <th>Passout Year</th>
                        <th>Registered Date</th>
                        <th>Status</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>
    </div>

    
    <script>
        
    </script>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth-check.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
