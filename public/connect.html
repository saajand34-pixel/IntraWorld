<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Connect - Intra World</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
         body { 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            background-color: #030712; 
            color: #ffffff; 
            padding-top: 100px;
            background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 24px 24px;
            color: #ffffff;
        }

        /* ===== FLOATING NAVBAR CONTAINER ===== */
        .nav-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: auto;
            max-width: 95%;
        }

        .floating-navbar {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #081b2e;
            padding: 8px 12px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        /* Nav Links Group */
        .nav-links { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }

        .nav-links a { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            padding: 10px 18px; 
            border-radius: 25px; 
            color: #8fa8bf; 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 500; 
            white-space: nowrap; 
            transition: all 0.2s ease; 
        }

        .nav-links a:hover { 
            color: #fff; 
            background: rgba(255, 255, 255, 0.08); 
        }

        .nav-links a.active { 
            color: #fff; 
            background: #0066ff; 
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.35);
        }

        .nav-links a.logout { 
            color: #ef4444; 
            background: rgba(239, 68, 68, 0.1);
            margin-left: 6px; 
        }

        .nav-links a.logout:hover { 
            background: #ef4444; 
            color: #ffffff; 
        }

        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .content { padding: 30px; flex: 1; overflow-y: auto; max-width: 1200px; margin: 0 auto; width: 100%; }

        .header-title { font-size: 28px; margin-bottom: 10px; }
        .header-desc { color: #7db7ff; margin-bottom: 30px; }
        .contact-box { background: #081b2e; padding: 25px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 30px; display: flex; gap: 15px; align-items: center; }
        .contact-box input { flex: 1; padding: 14px 18px; background: #102b45; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-size: 14px; outline: none; }
        .contact-box button { padding: 14px 25px; background: #0066ff; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 500; transition: 0.2s; }
        .contact-box button:hover { background: #0f3f8c; }
        .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .student-card { background: #0b2137; padding: 25px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; text-align: center; }
        .student-avatar { width: 70px; height: 70px; border-radius: 50%; background: #0066ff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; color: white; margin-bottom: 15px; }
        .student-card h3 { font-size: 18px; margin-bottom: 5px; }
        .student-card p { color: #7db7ff; font-size: 13px; margin-bottom: 15px; }
        .connect-btn { width: 100%; padding: 10px; background: #0066ff; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .connect-btn:hover { background: #0f3f8c; }
        .connect-btn.connected { background: #2e7d32; cursor: default; }

        @media (max-width: 768px) {
            .nav-container { width: 95%; top: 10px; }
            .floating-navbar { padding: 6px 8px; }
            .nav-links a { padding: 8px 12px; font-size: 13px; }
            .nav-links a span { display: none; }
            .header-title { font-size: 24px; }
        }
    </style>
</head>
<body>

    <!-- FLOATING NAVBAR -->
    <div class="nav-container">
        <header class="floating-navbar">
            <nav class="nav-links">
                <a href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>
                <a href="connect.html" class="active">
                    <i class="fa-solid fa-user-group"></i>
                    <span>Student Connect</span>
                </a>
                <a href="posts.html">
                    <i class="fa-solid fa-newspaper"></i>
                    <span>Posts</span>
                </a>
                <a href="messages.html">
                    <i class="fa-solid fa-comments"></i>
                    <span>Messages</span>
                </a>
                <a href="settings.html">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
                <a class="logout" id="logoutBtn" href="index.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </nav>
        </header>
    </div>

    <main class="main">
        <section class="content">
            <h1 class="header-title">Student Connect</h1>
            <p class="header-desc">Find and connect with classmates using saved phone numbers or profile names.</p>

            <div class="contact-box">
                <i class="fa-solid fa-phone" style="color: #7db7ff; font-size: 18px;"></i>
                <input type="text" id="phoneSearchInput" placeholder="Enter contact phone number (e.g., +919876543210 or 9876543210)...">
                <button id="searchPhoneBtn"><i class="fa-solid fa-magnifying-glass"></i> Find Contact</button>
            </div>

            <div class="student-grid" id="studentGrid">
                <div style="color: #7db7ff;">Loading registered students...</div>
            </div>
        </section>
    </main>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="connect.js"></script>
</body>
</html>
