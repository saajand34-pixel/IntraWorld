<!DOCTYPE html>
<html lang="en">
<head>
    <!-- BULLETPROOF AUTH GUARD & BFCACHE SECURITY -->
    <script>
        (function() {
            function enforceAuth() {
                try {
                    var raw = localStorage.getItem("currentUser") || localStorage.getItem("intraWorldUser");
                    if (!raw) {
                        document.documentElement.style.display = "none";
                        window.location.replace("index.html");
                        return false;
                    }
                    var u = JSON.parse(raw);
                    if (!u || !u.email) {
                        localStorage.clear();
                        sessionStorage.clear();
                        document.documentElement.style.display = "none";
                        window.location.replace("index.html");
                        return false;
                    }
                    return true;
                } catch(e) {
                    localStorage.clear();
                    sessionStorage.clear();
                    document.documentElement.style.display = "none";
                    window.location.replace("index.html");
                    return false;
                }
            }
            if (!enforceAuth()) {
                if (document.documentElement) document.documentElement.style.display = "none";
            }
            window.addEventListener("pageshow", function(event) {
                enforceAuth();
            });
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Connect - Intra World</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
         body { 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            background-color: #36050e;
            background: #36050e;
            color: #f8fafc;

            }

        /* ===== FLOATING NAVBAR CONTAINER ===== */
        .nav-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: auto;
            max-width: 95%;
        }

        .floating-navbar {
            display: flex;
            align-items: center;
            justify-content: center;

            backdrop-filter: blur(18px);

            border-radius: 50px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(245, 158, 11, 0.18);
        }

        /* Nav Links Group */
        .nav-links { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }

        .nav-links a {

            align-items: center; 
            gap: 8px; 
            padding: 10px 18px; 
            border-radius: 25px; 
            color: #d6d3d1; 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 500; 
            white-space: nowrap; 
            transition: all 0.2s ease; 
        }

        .nav-links a:hover { 
            color: #f59e0b; 
            background: rgba(245, 158, 11, 0.12); 
        }

        .nav-links a.active { 
            color: #180206; 
            background: linear-gradient(135deg, #ffd700 0%, #f59e0b 50%, #d97706 100%); 
            font-weight: 700;
            box-shadow: none;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .nav-links a.logout { 
            color: #ef4444; 
            background: rgba(239, 68, 68, 0.1);
            margin-left: 6px; 
        }

        .nav-links a.logout:hover { 
            background: #ef4444; 
            color: #ffffff; 
        }

        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .content { padding: 30px; flex: 1; overflow-y: auto; max-width: 1200px; margin: 0 auto; width: 100%; }

        .header-title { font-size: 28px; margin-bottom: 10px; }
        .header-desc { color: #f59e0b; margin-bottom: 30px; }
        .contact-box { background: #220308; border: 1px solid rgba(245, 158, 11, 0.3); padding: 25px; border-radius: 18px; margin-bottom: 30px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .contact-box input { flex: 1; min-width: 250px; padding: 14px 18px; background: #36050e;
            border: 1px solid rgba(245, 158, 11, 0.25); border-radius: 12px; color: white; font-size: 14px; outline: none; }
        .contact-box input:focus { border-color: #f59e0b; }
        .contact-box button { padding: 14px 25px; background: linear-gradient(135deg, #ffd700 0%, #f59e0b 50%, #d97706 100%); color: #180206; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; transition: 0.2s; white-space: nowrap; box-shadow: none;
            border: 1px solid rgba(245, 158, 11, 0.4); }
        .contact-box button:hover { background: linear-gradient(135deg, #fef08a 0%, #ffd700 50%, #f59e0b 100%); }

        /* Incoming Connection Requests Section */
        .requests-section { background: #220308; border: 1px solid rgba(245, 158, 11, 0.38); border-radius: 18px; padding: 24px; margin-bottom: 30px; }
        .requests-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .requests-section-title { font-size: 18px; font-weight: 600; color: #f59e0b; display: flex; align-items: center; gap: 10px; }
        .badge-count { background: linear-gradient(135deg, #ffd700 0%, #f59e0b 50%, #d97706 100%); color: #180206; font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 700; }
        .requests-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .request-card { background: #220308; border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .request-card .req-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #c41226); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: white; margin-bottom: 10px; border: 2px solid rgba(255, 215, 0, 0.45); }
        .request-card h4 { font-size: 16px; margin-bottom: 4px; color: #fff; }
        .request-card .regid-text { font-size: 12px; color: #f59e0b; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); padding: 3px 10px; border-radius: 20px; margin-bottom: 14px; }
        .req-btn-group { display: flex; gap: 10px; width: 100%; }
        .btn-accept { flex: 1; padding: 9px; background: #16a34a; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-accept:hover { background: #15803d; }
        .btn-decline { flex: 1; padding: 9px; background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-decline:hover { background: #ef4444; color: #fff; }

        /* Student Grid & Cards */
        .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .student-card { background: #220308; padding: 25px; border-radius: 18px; border: 1px solid rgba(245, 158, 11, 0.3); display: flex; flex-direction: column; align-items: center; text-align: center; transition: all 0.3s; }
        .student-card:hover { border-color: rgba(212, 175, 55, 0.45); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .student-avatar { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #c41226); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; color: white; margin-bottom: 15px; border: 2px solid rgba(255, 215, 0, 0.45); }
        .student-card h3 { font-size: 18px; margin-bottom: 5px; }
        .student-card p { color: #f59e0b; font-size: 13px; margin-bottom: 8px; }
        .student-regid-tag { font-size: 12px; color: #f59e0b; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); padding: 4px 12px; border-radius: 20px; margin-bottom: 14px; display: inline-flex; align-items: center; gap: 6px; }
        .connect-btn { width: 100%; padding: 10px; background: linear-gradient(135deg, #ffd700 0%, #f59e0b 50%, #d97706 100%); color: #180206; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: none; }
        .connect-btn:hover { background: linear-gradient(135deg, #fef08a 0%, #ffd700 50%, #f59e0b 100%); }
        .connect-btn.connected { background: #16a34a !important; cursor: default; }
        .connect-btn.pending { background: #f59e0b !important; color: #fff; cursor: default; }

        @media (max-width: 768px) {
            .nav-container { width: 95%; top: 10px; }
            .floating-navbar { padding: 6px 8px; }
            .nav-links a { padding: 8px 12px; font-size: 13px; }
            .nav-links a span { display: none; }
            .header-title { font-size: 24px; }
        }
    
        .view-posts-btn {

        }
        .profile-tab-btn.active {

            font-weight: 700;
            border-color: #ffd700;
        }
        .profile-posts-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #1c0207;
        }
        .profile-post-card {
            background: #250309;
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .profile-post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .post-type-badge {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .badge-public {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
        }
        .badge-community {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: #fbbf24;
        }
        .profile-post-content {
            font-size: 14px;
            color: #f8fafc;
            line-height: 1.5;
            word-break: break-word;
        }
        .profile-post-media {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid rgba(245, 158, 11, 0.2);
            transition: transform 0.2s ease;
        }
        .profile-post-media:hover {
            transform: scale(1.01);
        }
        .profile-post-footer {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: #94a3b8;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

    </style>
</head>
