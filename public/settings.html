<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Intra World</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <!-- Auth Guard -->
    <script type="module" src="js/auth-check.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            background-color: #030712; 
            color: #ffffff; 
            padding-top: 100px;
            background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* ===== FLOATING NAVBAR CONTAINER ===== */
        .nav-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: auto;
            max-width: 95%;
        }

        .floating-navbar {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #081b2e;
            padding: 8px 12px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .nav-links { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }

        .nav-links a { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            padding: 10px 18px; 
            border-radius: 25px; 
            color: #8fa8bf; 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 500; 
            white-space: nowrap; 
            transition: all 0.2s ease; 
        }

        .nav-links a:hover { 
            color: #fff; 
            background: rgba(255, 255, 255, 0.08); 
        }

        .nav-links a.active { 
            color: #fff; 
            background: #0066ff; 
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.35);
        }

        .nav-links a.logout { 
            color: #ef4444; 
            background: rgba(239, 68, 68, 0.1);
            margin-left: 6px; 
        }

        .nav-links a.logout:hover { 
            background: #ef4444; 
            color: #ffffff; 
        }

        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .content { padding: 35px; flex: 1; overflow-y: auto; max-width: 900px; margin: 0 auto; width: 100%; }

        @media (max-width: 768px) {
            .nav-container { width: 95%; top: 10px; }
            .floating-navbar { padding: 6px 8px; }
            .nav-links a { padding: 8px 12px; font-size: 13px; }
            .nav-links a span { display: none; }
        }

        .settings-card {
            background: linear-gradient(135deg, rgba(6, 21, 36, 0.8), rgba(16, 43, 69, 0.6));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 28px;
            margin-top: 20px;
        }

        .profile-upload-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .dashboard-avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
        }

        .upload-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .upload-btn, .save-btn {
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .upload-btn {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .save-btn {
            background: #22c55e;
            color: #ffffff;
        }

        /* User Profile Info Fields */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
            margin-top: 20px;
        }

        .info-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .info-field label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-field input {
            background: #081624;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .info-field input:disabled {
            background: #050e17;
            color: #cbd5e1;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            width: fit-content;
        }
        .status-verified { background: #16a34a; color: white; }
        .status-pending { background: #ca8a04; color: white; }
    </style>
</head>
<body>

    <!-- FLOATING NAVBAR -->
    <div class="nav-container">
        <header class="floating-navbar">
            <nav class="nav-links">
    <a href="dashboard.html">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>
    <a href="connect.html">
        <i class="fa-solid fa-user-group"></i>
        <span>Student Connect</span>
    </a>
    <a href="posts.html">
        <i class="fa-solid fa-newspaper"></i>
        <span>Posts</span>
    </a>
    <a href="community.html">
        <i class="fa-solid fa-location-dot"></i>
        <span>Community</span>
    </a>
    <a href="messages.html">
        <i class="fa-solid fa-comments"></i>
        <span>Messages</span>
    </a>
    <a href="settings.html" class="active">
        <i class="fa-solid fa-gear"></i>
        <span>Settings</span>
    </a>
    <a class="logout" id="logoutBtn" href="index.html">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Logout</span>
    </a>
</nav>
        </header>
    </div>

    <main class="main">
        <section class="content">
            <h2>Account Settings</h2>

            <!-- PHOTO UPLOAD CARD -->
            <div class="settings-card">
                <h3><i class="fa-solid fa-image"></i> Profile Photo</h3>
                <p style="font-size:13px; color:#94a3b8; margin-top:4px;">Upload a permanent avatar picture to customize your Intra World identity.</p>

                <div class="profile-upload-container">
                    <img id="settings-avatar-preview" class="dashboard-avatar" src="https://via.placeholder.com/85" alt="Profile Preview">

                    <div class="upload-controls">
                        <label for="profilePhotoInput" class="upload-btn">
                            <i class="fa-solid fa-camera"></i> Choose Photo
                        </label>
                        <input type="file" id="profilePhotoInput" accept="image/*" hidden>
                        <button id="savePhotoBtn" class="save-btn" style="display: none;">
                            <i class="fa-solid fa-check"></i> Save Photo
                        </button>
                    </div>
                </div>
            </div>

            <!-- USER DETAILS DISPLAY CARD -->
            <div class="settings-card">
                <h3><i class="fa-solid fa-id-card"></i> Personal Information</h3>
                <p style="font-size:13px; color:#94a3b8; margin-top:4px;">Your registered details stored in Firestore database.</p>

                <div class="info-grid">
                    <div class="info-field">
                        <label>Full Name</label>
                        <input type="text" id="userFullName" disabled>
                    </div>

                    <div class="info-field">
                        <label>Email Address</label>
                        <input type="email" id="userEmail" disabled>
                    </div>

                    <div class="info-field">
                        <label>Mobile Number</label>
                        <input type="text" id="userMobile" disabled>
                    </div>

                    <div class="info-field">
                        <label>State</label>
                        <input type="text" id="userState" disabled>
                    </div>

                    <div class="info-field">
                        <label>Qualification</label>
                        <input type="text" id="userQualification" disabled>
                    </div>

                    <div class="info-field">
                        <label>College / University</label>
                        <input type="text" id="userCollege" disabled>
                    </div>

                    <div class="info-field">
                        <label>Passout Year</label>
                        <input type="text" id="userPassout" disabled>
                    </div>

                    <div class="info-field">
                        <label>Verification Status</label>
                        <div id="userVerificationBadge" style="margin-top:6px;">
                            <span class="status-badge status-pending">Pending</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/settings.js"></script>
</body>
</html>
