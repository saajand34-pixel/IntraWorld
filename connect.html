<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Connect - Intra World</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #061524;
            color: #fff;
            overflow-x: hidden;
        }

        /* Main Layout */
        .main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .topbar {
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 38px;
            background: #081b2e;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .menu-btn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 12px;
            background: #102b45;
            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            background: #0066ff;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(0, 102, 255, 0.25);
        }

        .search {
            width: 420px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .search input {
            width: 100%;
            padding: 14px 18px;
            background: #102b45;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            color: #ffffff;
            outline: none;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .search input::placeholder {
            color: #8fa8bf;
        }

        .search input:focus {
            border-color: #1684ff;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.12);
        }

        .user {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .user span {
            color: #e4edf6;
            font-size: 14px;
            font-weight: 500;
        }

        .user img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0066ff;
            background: #102b45;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: #04101d;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            z-index: 300;
            transform: translateX(-100%);
            transition: transform 0.35s ease;
            box-shadow: 15px 0 40px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
            padding-bottom: 20px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }


        .logo h2 {
            font-size: 18px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .logo span {
            display: block;
            margin-top: 2px;
            font-size: 10px;
            color: #7db7ff;
            font-weight: 400;
        }

        .close-btn {
            position: absolute;
            top: 0;
            right: 0;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 10px;
            background: #102b45;
            color: #b9c9d8;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: #ff4757;
            color: #ffffff;
        }

        .menu-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            margin-bottom: 20px;
            padding-right: 8px;
        }

        .menu-container::-webkit-scrollbar {
            width: 6px;
        }

        .menu-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .menu-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .menu-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .menu a {
            text-decoration: none;
            color: #c8d4df;
            padding: 13px 15px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .menu a i {
            width: 20px;
            text-align: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .menu a:hover {
            background: #0e2e52;
            color: #ffffff;
            transform: translateX(3px);
        }

        .menu a.active {
            background: linear-gradient(135deg, #0066ff, #1684ff);
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 102, 255, 0.25);
        }

        .bottom {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            flex-shrink: 0;
        }

        .menu .logout {
            color: #ff7b86;
            background: rgba(255, 71, 87, 0.06);
        }

        .menu .logout:hover {
            background: rgba(255, 71, 87, 0.15);
            color: #ff525f;
            transform: translateX(3px);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(3px);
            opacity: 0;
            visibility: hidden;
            z-index: 200;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* Content */
        .content {
            flex: 1;
            padding: 40px;
        }

        .header-title {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header-desc {
            color: #7db7ff;
            margin-bottom: 30px;
        }

        .contact-box {
            background: #081b2e;
            padding: 25px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .contact-box input {
            flex: 1;
            padding: 14px 18px;
            background: #102b45;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .contact-box button {
            padding: 14px 25px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        .contact-box button:hover {
            background: #0f3f8c;
        }

        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .student-card {
            background: #0b2137;
            padding: 25px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .student-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #0066ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            color: white;
            margin-bottom: 15px;
        }

        .student-card h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .student-card p {
            color: #7db7ff;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .connect-btn {
            width: 100%;
            padding: 10px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .connect-btn:hover {
            background: #0f3f8c;
        }

        .connect-btn.connected {
            background: #2e7d32;
            cursor: default;
        }

        @media (max-width: 768px) {
            .topbar {
                padding: 0 20px;
            }

            .search {
                width: 200px;
                font-size: 12px;
            }

            .user span {
                display: none;
            }

            .content {
                padding: 20px;
            }

            .header-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
        <div class="sidebar-header">
            <button class="close-btn" id="closeMenu" aria-label="Close navigation">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="logo">
                <img src="logo.png" alt="Intra World Logo">
                <h2>INTRA WORLD</h2>
            </div>
        </div>

        <div class="menu-container">
            <nav class="menu">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
                <a href="connect.html" class="active"><i class="fa-solid fa-user-group"></i><span>Student Connect</span></a>
                <a href="posts.html"><i class="fa-solid fa-newspaper"></i><span>Posts</span></a>
                <a href="messages.html"><i class="fa-solid fa-comments"></i><span>Messages</span></a>
                <a href="profile.html"><i class="fa-solid fa-user"></i><span>Profile</span></a>
                <a href="settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
            </nav>
        </div>

        <div class="bottom">
            <nav class="menu">
                <a class="logout" href="index.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </nav>
        </div>
    </aside>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Main Content -->
    <main class="main">
        <header class="topbar">
            <button class="menu-btn" id="openMenu" aria-label="Open navigation">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="search">
                <input type="text" placeholder="Search Students, Research, Communities...">
            </div>

            <div class="user">
                <span id="welcomeName">Loading...</span>
                <img id="profileImage" src="https://via.placeholder.com/45" alt="Profile">
            </div>
        </header>

        <section class="content">
            <h1 class="header-title">Student Connect</h1>
            <p class="header-desc">Find and connect with classmates using saved phone numbers or profile names.</p>

            <div class="contact-box">
                <i class="fa-solid fa-phone" style="color: #7db7ff; font-size: 18px;"></i>
                <input type="text" id="phoneSearchInput" placeholder="Enter contact phone number (e.g., +919876543210 or 9876543210)...">
                <button id="searchPhoneBtn"><i class="fa-solid fa-magnifying-glass"></i> Find Contact</button>
            </div>

            <div class="student-grid" id="studentGrid">
                <div style="color: #7db7ff;">Loading registered students...</div>
            </div>
        </section>
    </main>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="connect.js"></script>
    <script>
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const openMenu = document.getElementById("openMenu");
        const closeMenu = document.getElementById("closeMenu");

        function openSidebar() {
            sidebar.classList.add("open");
            overlay.classList.add("show");
            document.body.style.overflow = "hidden";
        }

        function closeSidebar() {
            sidebar.classList.remove("open");
            overlay.classList.remove("show");
            document.body.style.overflow = "";
        }

        openMenu.addEventListener("click", openSidebar);
        closeMenu.addEventListener("click", closeSidebar);
        overlay.addEventListener("click", closeSidebar);

        document.querySelectorAll(".menu a").forEach(link => {
            link.addEventListener("click", () => closeSidebar());
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") closeSidebar();
        });
    </script>
</body>
</html>
